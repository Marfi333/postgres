name: Publish Docker Image

on:
  push:
    branches:
      - production

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: alpine-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to github docker registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build docker image
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ${IMAGE_NAME}/postgres:latest -t ${IMAGE_NAME}/postgres:${{ github.sha }} -f ci/Dockerfile .
      - name: Publish docker image
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker push ${IMAGE_NAME}/postgres:${{ github.sha }}
          docker push ${IMAGE_NAME}/postgres:latest